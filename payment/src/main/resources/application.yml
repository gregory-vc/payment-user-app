server:
  port: 8081
  servlet:
    context-path: /payment

spring:
  application:
    name: payment

integrations:
  clients:
    payments-executor-client:
      url: http://localhost:8089/executor
      connect-timeout: 5s
      read-timeout: 10s
      execute-url: /payments/execute
      execute-url-500: /payments/execute/500
